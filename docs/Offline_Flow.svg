<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <!-- Background -->
  <rect width="700" height="640" fill="#F8FAFC"/>

  <!-- Lane backgrounds -->
  <rect x="20" y="195" width="310" height="345" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="370" y="195" width="310" height="200" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Lane labels -->
  <text x="175" y="217" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.5">FIRST VISIT</text>
  <text x="525" y="217" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.5">RETURNING VISIT</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/>
    </marker>
    <marker id="ay" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
    <marker id="an" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- USER NODE -->
  <rect x="250" y="25" width="200" height="44" rx="22" fill="#1E293B"/>
  <text x="350" y="52" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="500">User opens app</text>

  <!-- User → Decision -->
  <line x1="350" y1="69" x2="350" y2="103" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- DECISION DIAMOND -->
  <polygon points="350,105 435,142 350,179 265,142" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="350" y="147" text-anchor="middle" fill="#92400E" font-size="12" font-weight="600">First visit?</text>

  <!-- YES arrow (left) -->
  <polyline points="265,142 175,142 175,228" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="218" y="135" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">Yes</text>

  <!-- NO arrow (right) -->
  <polyline points="435,142 525,142 525,228" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#an)"/>
  <text x="480" y="135" text-anchor="middle" fill="#F59E0B" font-size="11" font-weight="600">No</text>

  <!-- FIRST VISIT COLUMN -->

  <!-- 1. Service Worker -->
  <rect x="35" y="230" width="280" height="52" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="175" y="252" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="600">⚙️  Service Worker</text>
  <text x="175" y="270" text-anchor="middle" fill="#6D28D9" font-size="11">installs · caches app shell</text>
  <line x1="175" y1="282" x2="175" y2="308" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2. Fetch from PokéAPI -->
  <rect x="35" y="310" width="280" height="52" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="175" y="332" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="600">🌐  Fetch from PokéAPI</text>
  <text x="175" y="350" text-anchor="middle" fill="#1D4ED8" font-size="11">all 151 Pokémon</text>
  <line x1="175" y1="362" x2="175" y2="388" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3. Cache API -->
  <rect x="35" y="390" width="280" height="52" rx="8" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="175" y="412" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="600">🖼️  Cache API</text>
  <text x="175" y="430" text-anchor="middle" fill="#1D4ED8" font-size="11">API responses · images</text>
  <line x1="175" y1="442" x2="175" y2="468" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4. IndexedDB -->
  <rect x="35" y="470" width="280" height="52" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="175" y="492" text-anchor="middle" fill="#065F46" font-size="12" font-weight="600">🗄️  IndexedDB</text>
  <text x="175" y="510" text-anchor="middle" fill="#047857" font-size="11">Pokémon data · Pokédex state</text>

  <!-- RETURNING VISIT COLUMN -->

  <!-- 1. App shell from Cache API -->
  <rect x="385" y="230" width="280" height="52" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="525" y="252" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="600">🗂️  App shell from Cache API</text>
  <text x="525" y="270" text-anchor="middle" fill="#1D4ED8" font-size="11">served instantly · no network</text>
  <line x1="525" y1="282" x2="525" y2="308" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2. Load from IndexedDB -->
  <rect x="385" y="310" width="280" height="52" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="525" y="332" text-anchor="middle" fill="#065F46" font-size="12" font-weight="600">🗄️  Load from IndexedDB</text>
  <text x="525" y="350" text-anchor="middle" fill="#047857" font-size="11">Pokémon data · Pokédex state</text>

  <!-- CONVERGENCE LINES → App ready -->
  <polyline points="175,522 175,560 350,560" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <polyline points="525,362 525,560 350,560" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="350" y1="560" x2="350" y2="572" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- APP READY -->
  <rect x="250" y="574" width="200" height="44" rx="22" fill="#10B981"/>
  <text x="350" y="601" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">✅  App ready</text>

  <!-- Footer note -->
  <text x="350" y="632" text-anchor="middle" fill="#CBD5E1" font-size="10">On returning visits, no network request is needed</text>

</svg>
